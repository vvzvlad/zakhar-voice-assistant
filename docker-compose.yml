# EXAMPLE compose — an illustration of how this service is configured, NOT a copy of what runs.
#
# What it is for: showing which variables the service reads, which volumes and ports it needs,
# and which labels matter. Copy it as a starting point for a deployment. That is the whole job.
#
# It is NOT kept in sync with the running deployment and MUST NOT BE. Wherever this service
# actually runs — in this fleet, a Portainer stack — THAT deployment is the only source of truth
# for what it does: its variables, its volume paths, its domain, its image tag. This file cannot
# answer any of those questions, and it is not trying to. A difference between the two is
# therefore NOT a defect and NOT something to reconcile: there is nothing here to bring into
# agreement. Do not "fix" this file against a running deployment, and do not change a deployment
# to match this file.
#
# NOTHING REAL GOES IN HERE. Not a password, not a token, not a key, not a host. Every value below
# is a PLACEHOLDER: `XXX` for a secret, `example.com` or `example.lc` for a name, a documentation
# address (RFC 5737 — 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) for an IP. That holds INSIDE
# COMMENTS TOO, and it holds for a value that is only a default rather than a credential. Never
# write a real one here, and never "correct" a placeholder to the value some deployment happens to
# use. Naming a real host is precisely what makes the next reader believe this file describes
# production — the mistake this header exists to prevent, and one that keeps being made. Several
# of these repositories are public and mirrored: a secret committed here is a secret published.
#
# ONE deliberate exception: the registry host, wherever it appears — in the image path or in a
# comment. It is real, because without it there is nothing to pull.
#
# Deploy from a prebuilt image — a `build:` here, where present, is for running locally.

# Deviation from the canonical web template: this is a LAN device<->server service,
# NOT a public web service behind Traefik. So there are no Traefik labels and no
# external `docker_main_net`. Instead the audio port is published straight to the
# LAN (`ports`) so the speaker can fetch generated audio. Outbound connections to
# the speaker (:6053) and to Node-RED / TTS work from the default bridge network.
#
# Config lives in data/config.json INSIDE the named volume (created from
# templates/default_config.json on first boot). Edit it there to set providers,
# API keys, devices, etc. The only environment-tunable values are the admin
# panel's bind host/port (PANEL_HOST / PANEL_PORT); everything else is in the JSON.

volumes:
  zakhar-voice-assistant:
  # Offline model files (Piper/Silero voices, the Vosk STT+wakeword model, the
  # Silero VAD onnx). They are hundreds of megabytes and are deliberately NOT in
  # the image — the Dockerfile copies only src/, templates/, main.py and the built
  # frontend — so this volume is what makes the image runnable at all: the config
  # template selects the Piper TTS voice at models/ru_RU-ruslan-medium.onnx and
  # src/plugins/tts/piper.py loads it EAGERLY during boot, before the audio server
  # is started. Without this mount the container writes its first-boot config and
  # then dies with FileNotFoundError on that path, so /health never answers and the
  # healthcheck below never passes.
  # Nothing fills this volume automatically: populate it by copying the model files
  # in by hand (see README).
  zakhar-voice-assistant-models:

services:
  zakhar-voice-assistant:
    # Built and published by .gitea/workflows/image-check-publish.yml, which derives
    # this path from the repository it runs in. This line is hand-written, so it is
    # the one place that has to be changed by hand if the registry or the repo moves.
    image: gitea.vvzvlad.xyz/projects/zakhar-voice-assistant:latest
    container_name: zakhar-voice-assistant
    restart: always
    volumes:
      - zakhar-voice-assistant:/app/data   # all mutable state survives restart/update
      # Model files, read-only to the app in practice but mounted rw so they can be
      # updated in place. Required for boot — see the note on the volume above.
      - zakhar-voice-assistant-models:/app/models
    ports:
      # Must match core.audio.port in data/config.json (default 8200).
      - "8200:8200"                          # publish the audio server to the LAN
      # Admin panel API + UI (also serves the agent MCP endpoint at /mcp);
      # must match PANEL_PORT (default 8201).
      - "8201:8201"
    environment:
      # All app config is in data/config.json (in the volume). The only env-tunable
      # values are the admin panel's bind host/port (applied at process start).
      # PANEL_HOST: "0.0.0.0"
      # PANEL_PORT: "8201"
      TZ: Europe/Moscow
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # Opts this container in to automatic redeployment when `:latest` moves. This is the key
      # the fleet uses; the `com.centurylinklabs.watchtower.*` family is legacy and is being
      # migrated away — this file has been migrated, so do not add a legacy key back.
      # Keep it in step with the tag on the `image:` line above: an updater pointed at a tag CI
      # never moves is an updater that silently does nothing.
      io.portainer.update.enable: "true"
    healthcheck:
      # python:3.11-slim ships no curl, so probe /health with the stdlib instead.
      #
      # These timings are NOT cosmetic, and the obvious "cheap" choice silently breaks
      # updates. Portainer's native updater recreates the container and then waits
      # RollbackTimeout (120 s on this fleet) for it to report healthy; if it has not by
      # then, the update is reverted and the image enters a cooldown that stops further
      # attempts, so it does not recover on its own. Docker schedules the FIRST probe one
      # `interval` after start — so a long interval leaves the container still `starting`
      # when that gate is judged, and every update gets rolled back while the service
      # itself is perfectly fine. That is exactly what happened on 2026-08-15 with
      # `interval: 30m`: State.Health had an EMPTY probe log (never ran), not a failing
      # one. The app answers /health ~1.5 s after start, so 30 s clears the gate with
      # room to spare.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
