name: PR checks

# The pull-request half of the pair: the same test suite, image build and smoke gate as
# image-check-publish.yml, then the image is thrown away. It never logs in and has no push step, and
# the publishing workflow has no `pull_request` trigger, so neither can do the other's job.
# The image is built because half of the gate (frontend bundle, libc++ layer, version stamp,
# startup) needs an artefact.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Cancelling is on here, unlike the publishing workflow: a superseded PR check produces nothing
# anyone consumes. There, cancelling would destroy a :<sha> rollback image.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `ubuntu-latest` is the label the instance-level runner advertises, not a machine name.
    runs-on: ubuntu-latest
    # Must exceed the sum of the step timeouts (30 + 25 + 24 = 79): when this fires act_runner kills
    # the job and `if: always()` cleanup steps are not guaranteed to run.
    timeout-minutes: 90
    # One definition shared by the test, smoke and cleanup steps (ci/smoke.py names its containers
    # after it). The run id keeps concurrent runs on the shared daemon apart, including the
    # publishing workflow; ci/smoke.py refuses to start without it.
    env:
      SMOKE_NAME: zakhar-voice-assistant-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history and tags, as in the publishing workflow: smoke check (b) compares the image's
        # version stamp against what the build passed.
        fetch-depth: 0

    - name: Run the test suite
      # First, so a red suite does not spend twenty minutes on a build.
      # Runs inside `python:3.11-slim` (the app image's base) instead of `actions/setup-python`,
      # which is not verified on this self-hosted runner.
      # 30 minutes: heavy dependency tree installed from a cold pip cache every run.
      timeout-minutes: 30
      # Byte-identical to the same step in image-check-publish.yml, with no `env:` of its own.
      run: |
        # `set -e` so a failed apt/pip aborts instead of running pytest against a half-installed
        # environment; `pipefail` so a `tar` that dies mid-stream is not masked by the exit status
        # of the docker command reading from it.
        set -e
        set -o pipefail
        # A re-run from the UI reuses the run id, hence this name; a previous attempt killed by the
        # step timeout may have left the container behind. A no-op when it did not.
        docker rm -f "$SMOKE_NAME-tests" || true
        # Excluded: .git (full history), host-built .venv/node_modules that would shadow the
        # container's, data/ (on a workstation it holds config.json with real API keys), and
        # models/ (hundreds of MB). Excluding models/ makes the TEN/Silero VAD integration tests skip
        # when this is run by hand on a populated workstation.
        # --pull always: the persistent daemon would otherwise serve a months-old python:3.11-slim.
        tar --exclude=./.git --exclude=./.venv --exclude=./frontend/node_modules --exclude=./models --exclude=./data -cf - . | docker run --rm -i --pull always --name "$SMOKE_NAME-tests" -w /w python:3.11-slim bash -c '
          set -e
          tar -xf -
          for i in 1 2 3; do apt-get update && break; sleep 5; done
          apt-get install -y --no-install-recommends libc++1 libc++abi1
          pip install --no-cache-dir -r requirements-dev.txt
          pytest --tb=short -q
        '

    - name: Compute image tags and version
      id: tags
      # On a pull request `github.ref_name` is the merge ref (`123/merge`), never `main`, so this
      # always produces a single sanitised branch tag. The body is kept byte-identical to the one in
      # image-check-publish.yml, unreachable `main` branch included.
      env:
        # Through the environment, not interpolated into the script: branch names may contain `$`,
        # backticks and parentheses, which would execute on the shared runner.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Docker rejects uppercase in image paths; Gitea allows it in repo names.
        # docker-compose.yml's `image:` line is hand-written and must follow a registry move.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        # `--always` degrades to a short sha when there are no tags; it needs full history.
        VERSION=$(git describe --tags --always --dirty)
        # Fail here with the cause rather than in the Dockerfile's `test -n "$VERSION"` after a full
        # build.
        [ -n "$VERSION" ] || { echo "git describe produced nothing: this checkout has no history to describe. The image would be stamped with the 0.0.0+unknown fallback and would misreport its version for the rest of its life." >&2; exit 1; }
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [ "$REF_NAME" = "main" ]; then
          # Order matters: the push step goes left to right, so :latest is pushed last and only after
          # its immutable :<sha> rollback twin reached the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate tests :<sha>, the one tag that can only mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise into a legal docker tag ([a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}): illegal chars
          # become `-`, an illegal first char becomes `_`, length is cut to 100.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch named `latest` would otherwise produce the production tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level timeouts are the ones act_runner enforces. 25 minutes covers a cold build of both
      # stages (npm ci + Vite, and the Python wheel set).
      timeout-minutes: 25
      env:
        # Through the environment, not interpolated into the script. `$TAGS` is a space-separated
        # list and stays unquoted below so it word-splits; `$VERSION` is quoted.
        TAGS: ${{ steps.tags.outputs.tags }}
        VERSION: ${{ steps.tags.outputs.version }}
      run: |
        set -e
        # Covers the tag step having written no output at all.
        [ -n "$VERSION" ] || { echo "No version to stamp: the tag-computation step produced no version output. Refusing to build an image that would report the 0.0.0+unknown fallback." >&2; exit 1; }
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull: the persistent daemon would otherwise keep stale node:20-slim/python:3.11-slim base
        # layers for months. This is a BuildKit build (the default since Engine 23.0), whose cache
        # the cleanup step cannot reclaim.
        docker build --pull . --file Dockerfile --build-arg VERSION="$VERSION" $tag_args

    - name: Smoke-test the built image
      # The same gate the publishing workflow runs, against an image built the same way.
      #
      # Read the module docstring in ci/smoke.py before changing the checks. The image carries no
      # models and the template selects Piper, which loads its voice eagerly, so a bare container
      # stops after writing its config. The gate uses one bare container (startup line, template
      # copy, config on disk, the stop happening in the one known place) and one with a model-free
      # config (/health, the panel, the reported version).
      #
      # No credentials and no outside network: the serving container's injected config uses a fake
      # TTS key and turns the stress stage off (otherwise RuAccent pulls a model from HuggingFace).
      # The bare container runs with `--network none`. A pull request has no access to deployment
      # keys.
      #
      # 24 minutes exceeds ci/smoke.py's documented worst case of 1365 s.
      timeout-minutes: 24
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
        # The version the build stamped; ci/smoke.py compares the image against it and refuses to
        # start without it.
        SMOKE_VERSION: ${{ steps.tags.outputs.version }}
      # Kept byte-identical to the same step in image-check-publish.yml; only `env:` differs.
      run: |
        python3 ci/smoke.py

    - name: Remove the smoke containers from the runner
      # Before the image cleanup, since a leftover container pins the image and makes `docker rmi`
      # fail. ci/smoke.py removes its own containers in a `finally`; this covers a step killed by its
      # timeout.
      if: always()
      run: |
        # -tests is the test-suite container; -template is the one-shot `--rm` run that reads the
        # config template out of the image; -probe is the idle container the image probe runs
        # inside; -bareboot and -serve are the two started with the image's real command. Kept in
        # step with ALL_SUFFIXES in ci/smoke.py and with the test step above.
        # No `set -eu` here on purpose: this is best-effort cleanup, every removal already ends in
        # `|| true`, and failing the step would turn a leftover container into a red job.
        for suffix in -tests -template -probe -bareboot -serve; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # Removes only this run's tags; `docker system prune` would hit other repos on the shared
      # daemon. The BuildKit cache and dangling base images left by `--pull` need a separate
      # periodic cleanup on the runner host.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS is legitimate here: either the build never ran, or it produced an untagged
        # image only the runner-host prune can reclaim (that run is already red, because ci/smoke.py
        # refuses an empty SMOKE_IMAGE). This body is shared verbatim by both workflows.
        for tag in $TAGS; do docker rmi "$tag" || true; done
